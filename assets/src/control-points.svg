<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img">
  <title>Fleet control points</title>
  <rect width="100%" height="100%" fill="#f7f6f3"/>
<text x="36" y="40" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Control points</text>
<text x="36" y="66" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The lane does not sit and wait. Saved state is what a restart reads.</text>
<line x1="230" y1="84" x2="230" y2="89" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,88 235,88 230,96" fill="#1c1917"/>
<rect x="36" y="96" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="124.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Module brief or ready issue</text>
<line x1="230" y1="144" x2="230" y2="157" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,156 235,156 230,164" fill="#1c1917"/>
<rect x="36" y="164" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="192.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Architect for briefs, stories, epics</text>
<line x1="230" y1="212" x2="230" y2="225" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,224 235,224 230,232" fill="#1c1917"/>
<rect x="36" y="232" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="260.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Planner assigns a ready task</text>
<line x1="230" y1="280" x2="230" y2="293" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,292 235,292 230,300" fill="#1c1917"/>
<rect x="36" y="300" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="328.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Lane: plan, implement, test</text>
<line x1="230" y1="348" x2="230" y2="361" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,360 235,360 230,368" fill="#1c1917"/>
<rect x="36" y="368" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="396.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">QA, then Security</text>
<line x1="230" y1="416" x2="230" y2="429" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,428 235,428 230,436" fill="#1c1917"/>
<rect x="36" y="436" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="464.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">BA triage</text>
<line x1="230" y1="484" x2="230" y2="497" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,496 235,496 230,504" fill="#1c1917"/>
<rect x="36" y="504" width="400" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="236.0" y="532.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Pull request on a feature branch</text>
<line x1="230" y1="552" x2="230" y2="565" stroke="#1c1917" stroke-width="1.4"/><polygon points="225,564 235,564 230,572" fill="#1c1917"/>
<rect x="36" y="572" width="400" height="48" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="236.0" y="600.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">A person merges</text>
<rect x="500" y="96" width="304" height="230" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.6"/>
<text x="518" y="128" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Isolation</text>
<text x="518" y="160" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">QA and Security receive the diff,</text>
<text x="518" y="186" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">the test results, and the spec title.</text>
<text x="518" y="212" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">The developer transcript is absent.</text>
<text x="518" y="238" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Security does not receive QA findings.</text>
<rect x="840" y="96" width="304" height="230" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.6"/>
<text x="858" y="128" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">While a person answers</text>
<text x="858" y="160" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">The question is recorded.</text>
<text x="858" y="186" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">The lane is freed.</text>
<text x="858" y="212" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Other ready work may start.</text>
<text x="858" y="238" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Parked work resumes first.</text>
<rect x="500" y="360" width="304" height="230" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.6"/>
<text x="518" y="392" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Recovery</text>
<text x="518" y="424" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">State files are atomic and locked.</text>
<text x="518" y="450" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">A continuation stores the stage</text>
<text x="518" y="476" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">and the branch.</text>
<text x="518" y="502" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Corrupt files are quarantined.</text>
<text x="518" y="528" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Jira writes replay in order.</text>
<rect x="840" y="360" width="304" height="230" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.6"/>
<text x="858" y="392" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Hard stops</text>
<text x="858" y="424" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">A person who moves the issue wins.</text>
<text x="858" y="450" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">The base branch is not a push target.</text>
<text x="858" y="476" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Done needs merge and green CI.</text>
<text x="858" y="502" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Hold and pause stop new claims.</text>
<text x="36" y="700" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Orange is a person. Spec approval can still time out into an approval. The lane path accepts the plan.</text>
<text x="36" y="726" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Pull-request approval is off unless switched on. Merge stays with a person unless that switch is on.</text>
</svg>
