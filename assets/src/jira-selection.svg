<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" role="img">
  <title>Which Jira issues Fleet takes</title>
  <rect width="100%" height="100%" fill="#f7f6f3"/>
<text x="40" y="42" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Which Jira issues are taken</text>
<text x="40" y="68" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">A skip records the cause. It does not change product code.</text>
<line x1="320.0" y1="88" x2="320.0" y2="101" stroke="#1c1917" stroke-width="1.4"/><polygon points="315.0,100 325.0,100 320.0,108" fill="#1c1917"/>
<rect x="40" y="108" width="560" height="78" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="320.0" y="142.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Ready status and a supported type</text>
<text x="320.0" y="160.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Required label, not held, not claimed</text>
<line x1="606" y1="147" x2="671" y2="147" stroke="#1c1917" stroke-width="1.4"/><polygon points="670,142 670,152 678,147" fill="#1c1917"/>
<line x1="320.0" y1="186" x2="320.0" y2="213" stroke="#1c1917" stroke-width="1.4"/><polygon points="315.0,212 325.0,212 320.0,220" fill="#1c1917"/>
<rect x="40" y="220" width="560" height="78" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="320.0" y="254.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Reporter, creator, and editors are allowed</text>
<text x="320.0" y="272.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Change history is complete enough to tell</text>
<line x1="606" y1="259" x2="671" y2="259" stroke="#1c1917" stroke-width="1.4"/><polygon points="670,254 670,264 678,259" fill="#1c1917"/>
<line x1="320.0" y1="298" x2="320.0" y2="325" stroke="#1c1917" stroke-width="1.4"/><polygon points="315.0,324 325.0,324 320.0,332" fill="#1c1917"/>
<rect x="40" y="332" width="560" height="78" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="320.0" y="366.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Blockers are Done</text>
<text x="320.0" y="384.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Unknown blocker status still blocks</text>
<line x1="606" y1="371" x2="671" y2="371" stroke="#1c1917" stroke-width="1.4"/><polygon points="670,366 670,376 678,371" fill="#1c1917"/>
<rect x="680" y="108" width="320" height="302" rx="12" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6"/>
<text x="704" y="146" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Skip</text>
<text x="704" y="186" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Wrong status or type</text>
<text x="704" y="222" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Missing label, or on hold</text>
<text x="704" y="258" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Disallowed editor</text>
<text x="704" y="294" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Open or unknown blocker</text>
<text x="704" y="330" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">One comment if writes are on</text>
<line x1="320.0" y1="414" x2="320.0" y2="453" stroke="#1c1917" stroke-width="1.4"/><polygon points="315.0,452 325.0,452 320.0,460" fill="#1c1917"/>
<rect x="40" y="460" width="560" height="48" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="320.0" y="488.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Then the issue type splits the path</text>
<line x1="320" y1="508" x2="320" y2="528" stroke="#1c1917" stroke-width="1.4"/>
<line x1="270" y1="528" x2="770" y2="528" stroke="#1c1917" stroke-width="1.4"/>
<rect x="40" y="548" width="460" height="96" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="270.0" y="582.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Task or bug</text>
<text x="270.0" y="600.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Unassigned, with acceptance criteria,</text>
<text x="270.0" y="618.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">mapped to exactly one lane.</text>
<rect x="540" y="548" width="460" height="96" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="770.0" y="582.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Story or epic</text>
<text x="770.0" y="600.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Unassigned. Acceptance criteria are</text>
<text x="770.0" y="618.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">not required yet. Architect brief.</text>
<line x1="270" y1="528" x2="270" y2="541" stroke="#1c1917" stroke-width="1.4"/><polygon points="265,540 275,540 270,548" fill="#1c1917"/>
<line x1="770" y1="528" x2="770" y2="541" stroke="#1c1917" stroke-width="1.4"/><polygon points="765,540 775,540 770,548" fill="#1c1917"/>
<rect x="40" y="680" width="460" height="68" rx="10" fill="#ffffff" stroke="#a8a29e" stroke-width="1.6"/>
<text x="270.0" y="709.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">One implementation task</text>
<text x="270.0" y="727.0" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">The architect is skipped</text>
<rect x="540" y="680" width="460" height="68" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="770.0" y="718.5" fill="#1c1917" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Spec decision, then sub-tasks</text>
<line x1="270" y1="644" x2="270" y2="673" stroke="#1c1917" stroke-width="1.4"/><polygon points="265,672 275,672 270,680" fill="#1c1917"/>
<line x1="770" y1="644" x2="770" y2="673" stroke="#1c1917" stroke-width="1.4"/><polygon points="765,672 775,672 770,680" fill="#1c1917"/>
<text x="40" y="778" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Generated sub-tasks and module-mirror issues are never taken as new work.</text>
<text x="40" y="806" fill="#57534e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Writes off: observe only. Empty reporter allow-list: nothing is taken.</text>
</svg>
